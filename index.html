<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular seu IMC</title>
</head>

<body>
    <main>
        <h1>Calculadora de IMC</h1>

        <div class="campo">
            <label for="txtNome">Nome:</label>
            <input type="text" id="txtNome" placeholder="Ex.Miguel Bueno Silva">
        </div>
        <div>
            <label for="numPesoId">Peso(kg):</label>
            <input type="number" id="numPesoId" placeholder="Ex.50.0kg">
        </div>
        <div>
            <label for="numAlturaId">Altura(m):</label>
            <input type="number" id="numAlturaId" placeholder="Ex.1.63">
        </div>
        <button type="button" onclick="calcularImc()">
            Calcular IMC
        </button>
        <div id="resultado">
            <!-- Resultado dinâmico vai JavaScript -->
        </div>
    </main>
    <script src="./js/calculadoraIMC.js"></script>
</body>
</html>
